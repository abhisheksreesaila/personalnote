name: Release

# Push a tag like v1.0.0 to build the macOS app, the Linux bundle and the two voice engines (Linux x86_64 CPU,
# A tag with a hyphen (v0.4.0-preview.1) is published as a pre-release and is not marked latest.
# macOS arm64 Metal) and attach them to a GitHub Release. The app's "Download voice" button fetches the engine
# for its OS from the same release; the speech model itself comes from Hugging Face, never from here.
# "Run workflow" (workflow_dispatch) builds the same files as downloadable run artifacts, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: scripts/build-mac-app.sh
            requirements: requirements-build.txt
            artifact: dist-app/personal-note-macos-*.zip
          - name: Linux
            os: ubuntu-22.04 # an older glibc (2.35) than ubuntu-latest, so the bundle runs on more distros
            script: scripts/build-linux-bundle.sh
            requirements: requirements.txt
            artifact: dist-app/personal-note-linux-*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ${{ matrix.requirements }} pyinstaller

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      # One private self-signed certificate signs every Mac build, so macOS sees each update as the same app
      # and the secure-notes keychain key opens without asking for the login password again. The certificate
      # (kept outside the repo too) ends on 2036-10-10; a new one changes the app's identity once, so every
      # Mac asks for the login password one more time after that update.
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then
            # A release from this repository must keep the same identity; forks and test runs may go ad hoc.
            if [ "$REF_TYPE" = "tag" ] && [ "$REPO" = "abhisheksreesaila/personalnote" ]; then
              echo "::error title=Signing::The signing certificate secret is missing; a release must not ship ad hoc."; exit 1
            fi
            echo "::warning title=Signing::No signing certificate; the app is signed ad hoc."; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PASS="$(uuidgen)"
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-certificate -c "Personal Note Self Signed" -Z "$KC" | awk '/SHA-1/ {print $3}')"
          [ -n "$IDENTITY" ] || { echo "::error title=Signing::The certificate did not import."; exit 1; }
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          SKIP_FRONTEND: "1"
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$REF_NAME" ]; then export APP_VERSION="${REF_NAME#v}"; fi
          sh ${{ matrix.script }}

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/sign.p12"
          [ -f "$RUNNER_TEMP/sign.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/sign.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: personal-note-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  voice-engine:
    name: Voice engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true # a failed engine build must not turn the whole run red or block the app release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04 # glibc 2.35, like the app bundle, so the engine runs on the same distros
            artifact: dist-app/personal-note-voice-engine-linux-x86_64.tar.gz*
          - name: macOS arm64
            os: macos-latest # Apple Silicon: Metal
            artifact: dist-app/personal-note-voice-engine-macos-arm64.tar.gz*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools
        run: python -m pip install "cmake>=3.26" ninja

      - name: GCC 13 (the engine's documented minimum on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Restore the engine build cache
        uses: actions/cache@v4
        with:
          path: build/voice-engine
          key: voice-engine-${{ matrix.os }}-${{ hashFiles('scripts/build-voice-engine.sh') }}
          restore-keys: voice-engine-${{ matrix.os }}-

      - name: Build the voice engine
        run: sh scripts/build-voice-engine.sh

      - name: Say so when the engine build failed
        if: failure()
        run: echo "::warning title=Voice engine::The ${{ matrix.name }} voice engine did not build; the release goes out without it."

      - uses: actions/upload-artifact@v4
        with:
          name: personal-note-voice-engine-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach to the GitHub Release
    # The app release never waits on, or fails with, a voice-engine build: this runs once `build` has succeeded
    # (and after the engine jobs have finished, so their files are there if they succeeded), and attaches
    # whichever engine files exist. A missing engine only means "Download voice" reports it is not available yet.
    needs: [build, voice-engine]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Note any missing voice engine
        run: |
          : > release-extra.md
          for name in personal-note-voice-engine-linux-x86_64.tar.gz personal-note-voice-engine-macos-arm64.tar.gz; do
            if [ ! -f "assets/$name" ]; then
              echo "::warning title=Voice engine missing::$name was not built, so Download voice is unavailable on that system for this release."
              echo "Voice engine \`$name\` was not built for this release; Download voice will not work on that system until it is added." >> release-extra.md
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: release-extra.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # a tag like v0.4.0-preview.1 is a preview, never the latest release
          make_latest: ${{ !contains(github.ref_name, '-') }}
