name: Release

# Push a tag like v1.0.0 to build the macOS app and the Linux bundle and attach both to a GitHub Release.
# "Run workflow" (workflow_dispatch) builds the same files as downloadable run artifacts, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: scripts/build-mac-app.sh
            requirements: requirements-build.txt
            artifact: dist-app/personal-note-macos-*.zip
          - name: Linux
            os: ubuntu-22.04 # an older glibc (2.35) than ubuntu-latest, so the bundle runs on more distros
            script: scripts/build-linux-bundle.sh
            requirements: requirements.txt
            artifact: dist-app/personal-note-linux-*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ${{ matrix.requirements }} pyinstaller

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Build the app
        env:
          SKIP_FRONTEND: "1"
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$REF_NAME" ]; then export APP_VERSION="${REF_NAME#v}"; fi
          sh ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: personal-note-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach to the GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
