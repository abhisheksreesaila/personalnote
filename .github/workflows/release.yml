name: Release

# Push a tag like v1.0.0 to build the macOS app, the Linux bundle and the two voice engines (Linux x86_64 CPU,
# macOS arm64 Metal) and attach them to a GitHub Release. The app's "Download voice" button fetches the engine
# for its OS from the same release; the speech model itself comes from Hugging Face, never from here.
# "Run workflow" (workflow_dispatch) builds the same files as downloadable run artifacts, with no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: scripts/build-mac-app.sh
            requirements: requirements-build.txt
            artifact: dist-app/personal-note-macos-*.zip
          - name: Linux
            os: ubuntu-22.04 # an older glibc (2.35) than ubuntu-latest, so the bundle runs on more distros
            script: scripts/build-linux-bundle.sh
            requirements: requirements.txt
            artifact: dist-app/personal-note-linux-*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ${{ matrix.requirements }} pyinstaller

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Build the app
        env:
          SKIP_FRONTEND: "1"
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$REF_NAME" ]; then export APP_VERSION="${REF_NAME#v}"; fi
          sh ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: personal-note-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  voice-engine:
    name: Voice engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true # a failed engine build must not turn the whole run red or block the app release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04 # glibc 2.35, like the app bundle, so the engine runs on the same distros
            artifact: dist-app/personal-note-voice-engine-linux-x86_64.tar.gz*
          - name: macOS arm64
            os: macos-latest # Apple Silicon: Metal
            artifact: dist-app/personal-note-voice-engine-macos-arm64.tar.gz*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools
        run: python -m pip install "cmake>=3.26" ninja

      - name: GCC 13 (the engine's documented minimum on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Restore the engine build cache
        uses: actions/cache@v4
        with:
          path: build/voice-engine
          key: voice-engine-${{ matrix.os }}-${{ hashFiles('scripts/build-voice-engine.sh') }}
          restore-keys: voice-engine-${{ matrix.os }}-

      - name: Build the voice engine
        run: sh scripts/build-voice-engine.sh

      - uses: actions/upload-artifact@v4
        with:
          name: personal-note-voice-engine-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach to the GitHub Release
    # The app release never waits on, or fails with, a voice-engine build: this runs once `build` has succeeded
    # (and after the engine jobs have finished, so their files are there if they succeeded), and attaches
    # whichever engine files exist. A missing engine only means "Download voice" reports it is not available yet.
    needs: [build, voice-engine]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
