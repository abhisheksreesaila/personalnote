<title>Omnibar and Focus Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* Layout: a design-review page. Two tabs (Omnibar, Focus mode); each is a live mock of the app window (glass shelves sidebar over
   the dotted desk, a note page beside it) with Option A/B/C switches. Tokens are the app's Crayon skin (light) and Night skin (dark). */
:root {
  --desk: #f2f2f7; --desk-dot: rgba(0,0,40,.07);
  --panel: #ffffff; --edge: #e3e3ea; --glass: rgba(255,255,255,.80);
  --ink: #111114; --ink-soft: #3a3a42; --muted: #5f5f69; --line: #e6e6ec;
  --accent: #2f6fe0; --accent-ink: #ffffff; --accent-soft: #e3ebfa;
  --secure: #6a46c9; --secure-soft: #efe9fb; --secure-line: #d9cdf6;
  --hover: rgba(17,17,20,.06); --pressed: rgba(17,17,20,.11);
  --paper: #ffffff; --mark: #fff1a8; --scrim: rgba(10,10,24,.22);
  --shadow: 0 1px 2px rgba(0,0,30,.05), 0 16px 40px -16px rgba(0,0,60,.22);
  --lift: 0 2px 4px rgba(0,0,30,.08), 0 24px 60px -16px rgba(0,0,60,.38);
  --ui: "Geist", system-ui, -apple-system, sans-serif;
  --display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --read: "Literata", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(.22,.75,.25,1); --ease-spring: cubic-bezier(.2,.9,.25,1.08);
  --r: 18px; --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0d1015; --desk-dot: rgba(160,190,255,.07);
  --panel: #161b23; --edge: #232a35; --glass: rgba(22,27,35,.86);
  --ink: #eceff4; --ink-soft: #b9c1cd; --muted: #8e98a8; --line: #262e3a;
  --accent: #7ee7c8; --accent-ink: #07261d; --accent-soft: rgba(126,231,200,.14);
  --secure: #c3a8ff; --secure-soft: rgba(195,168,255,.13); --secure-line: rgba(195,168,255,.32);
  --hover: rgba(236,239,244,.07); --pressed: rgba(236,239,244,.13);
  --paper: #1b212b; --mark: rgba(255,214,102,.28); --scrim: rgba(0,0,0,.45);
  --shadow: 0 0 0 1px rgba(236,239,244,.04), 0 20px 50px -20px rgba(0,0,0,.7);
  --lift: 0 0 0 1px rgba(236,239,244,.08), 0 26px 64px -14px rgba(0,0,0,.85);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --desk: #0d1015; --desk-dot: rgba(160,190,255,.07);
  --panel: #161b23; --edge: #232a35; --glass: rgba(22,27,35,.86);
  --ink: #eceff4; --ink-soft: #b9c1cd; --muted: #8e98a8; --line: #262e3a;
  --accent: #7ee7c8; --accent-ink: #07261d; --accent-soft: rgba(126,231,200,.14);
  --secure: #c3a8ff; --secure-soft: rgba(195,168,255,.13); --secure-line: rgba(195,168,255,.32);
  --hover: rgba(236,239,244,.07); --pressed: rgba(236,239,244,.13);
  --paper: #1b212b; --mark: rgba(255,214,102,.28); --scrim: rgba(0,0,0,.45);
  --shadow: 0 0 0 1px rgba(236,239,244,.04), 0 20px 50px -20px rgba(0,0,0,.7);
  --lift: 0 0 0 1px rgba(236,239,244,.08), 0 26px 64px -14px rgba(0,0,0,.85);
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; }
h1 { font: 700 28px/1.1 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 64ch; }
.switches { display: flex; flex-wrap: wrap; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; color: var(--ink-soft); font: 500 13px var(--ui); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.optnote { font-size: 13px; color: var(--ink-soft); background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; }
.optnote b { color: var(--ink); }
kbd { font: 500 11px var(--mono); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--panel); color: var(--ink-soft); }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- the mock window ---------- */
.window { position: relative; display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 14px; padding: 12px; height: 620px;
  border-radius: 22px; border: 1px solid var(--edge); background-color: var(--desk);
  background-image: radial-gradient(var(--desk-dot) 1px, transparent 1.2px); background-size: 22px 22px; overflow: hidden; }
.side { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 8px; align-self: start;
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); display: grid; gap: 2px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 10px; font: 700 15px var(--display); letter-spacing: -.02em; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); display: inline-block; }
.shelf { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; font: 600 13.5px var(--ui); color: var(--ink); }
.shelf.open { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
.shelf .n { margin-left: auto; font: 500 11.5px var(--ui); color: var(--muted); }
.sub-row { padding: 5px 8px 5px 32px; font-size: 12.5px; color: var(--ink-soft); border-radius: 9px; }
.sub-row.active { background: var(--pressed); color: var(--ink); font-weight: 500; }

.stage { position: relative; min-width: 0; display: grid; grid-template-rows: auto minmax(0,1fr); }
.topbar { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 10px; padding: 0 2px 10px; }
.crumb { justify-self: start; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.acts { justify-self: end; display: flex; gap: 8px; }
.gbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--edge); background: var(--glass); color: var(--ink-soft); box-shadow: var(--shadow); cursor: pointer; }
.gbtn:hover { color: var(--ink); }
.page { background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); padding: 44px 56px; position: relative; overflow: hidden; }
.page h2 { font: 700 30px/1.15 var(--display); letter-spacing: -.035em; margin: 0 0 14px; }
.page p { font: 400 18px/1.65 var(--read); max-width: 62ch; color: var(--ink); margin: 0 0 12px; }
.dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow); }
.dock span { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-soft); }
.dock span.on { background: var(--ink); color: var(--panel); }

/* ---------- omnibar: the slim bar ---------- */
.omni { display: flex; align-items: center; gap: 8px; width: clamp(220px, 34vw, 380px); height: 36px; padding: 0 8px 0 12px; border-radius: 999px; border: 1px solid var(--edge);
  background: var(--glass); box-shadow: var(--shadow); color: var(--muted); font: 400 13.5px var(--ui); cursor: text; text-align: left;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); transition: border-color 140ms, box-shadow 140ms; }
.omni:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); }
.omni .ph { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.omni-icon { display: none; }

/* ---------- omnibar: the open panel ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; transition: opacity 160ms var(--ease-out); }
.scrim.on { opacity: 1; }
.panel { position: absolute; z-index: 21; left: 50%; display: grid; grid-template-rows: auto minmax(0,1fr) auto; background: var(--panel); border: 1px solid var(--edge);
  border-radius: 20px; box-shadow: var(--lift); overflow: hidden; transform-origin: 50% 0; animation: grow 180ms var(--ease-spring); }
@keyframes grow { from { opacity: 0; transform: translateX(-50%) scale(.96) translateY(-8px); } to { opacity: 1; transform: translateX(-50%); } }
.panel { transform: translateX(-50%); }
.panel .field { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel .field svg.ic { width: 20px; height: 20px; color: var(--muted); }
.panel input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: 400 19px var(--ui); outline: none; }
.panel input::placeholder { color: var(--muted); }
.panel .body { overflow: auto; min-height: 0; }
.panel .foot { display: flex; flex-wrap: wrap; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.group { padding: 6px 8px 4px; }
.group h4 { margin: 6px 8px 4px; font: 600 11px var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.res { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 8px 10px; border-radius: 11px; cursor: pointer; font: inherit; }
.res .ri { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); color: var(--ink-soft); flex: none; }
.res .rt { min-width: 0; flex: 1; display: grid; gap: 1px; }
.res .t { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .s.read { font-family: var(--read); font-size: 13px; color: var(--ink-soft); }
.res .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; align-self: center; }
.res mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.res.sel { background: var(--accent-soft); }
.res.sel .ri { background: var(--accent); color: var(--accent-ink); }
.res.secure .ri { background: var(--secure-soft); color: var(--secure); }
.res.secure .s { color: var(--secure); }
.res .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.res .ret { opacity: 0; color: var(--muted); align-self: center; }
.res.sel .ret { opacity: 1; }
.none { padding: 26px 18px 18px; display: grid; gap: 4px; justify-items: center; text-align: center; color: var(--muted); }
.none b { color: var(--ink); font: 600 15px var(--ui); }

/* A: centred spotlight */
.optA .panel { top: 72px; width: min(640px, calc(100% - 32px)); max-height: 470px; }
/* B: two panes with a preview */
.optB .panel { top: 56px; width: min(860px, calc(100% - 32px)); height: 500px; }
.optB .split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr); min-height: 0; }
.optB .body { border-right: 1px solid var(--line); }
.preview { overflow: auto; padding: 22px 24px; background: color-mix(in srgb, var(--desk) 55%, var(--panel)); display: grid; align-content: start; gap: 10px; }
.preview .pv-path { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.preview h3 { font: 700 22px/1.2 var(--display); letter-spacing: -.03em; margin: 0; }
.preview p { font: 400 15px/1.6 var(--read); margin: 0; color: var(--ink-soft); }
.preview .pv-lock { display: grid; justify-items: center; gap: 8px; padding: 40px 0; color: var(--secure); text-align: center; }
.preview .pv-lock p { color: var(--muted); font-family: var(--ui); font-size: 13px; }
/* C: the bar itself grows down (no dim) */
.optC .scrim { background: transparent; }
.optC .panel { top: 2px; width: min(560px, calc(100% - 32px)); max-height: 440px; border-radius: 20px; transform-origin: 50% 18px; }
.optC .panel .field { padding: 7px 12px; }
.optC .panel input { font-size: 15px; }
.optC .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 4px; }
.chip { border: 1px solid var(--edge); background: var(--panel); color: var(--ink-soft); font: 500 12px var(--ui); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* phone frame */
.phone { width: 390px; max-width: 100%; height: 700px; margin: 0 auto; border-radius: 40px; border: 10px solid var(--ink); background-color: var(--desk); position: relative; overflow: hidden;
  background-image: radial-gradient(var(--desk-dot) 1px, transparent 1.2px); background-size: 22px 22px; }
.phone .ptop { display: flex; justify-content: space-between; align-items: center; padding: 18px 14px 10px; }
.phone .page { margin: 0 12px; padding: 26px 22px; height: 560px; }
.phone .page h2 { font-size: 24px; }
.phone .page p { font-size: 16px; }
.phone .omni-icon { display: grid; }
.phone .panel { inset: 0; left: 0; transform: none; width: 100%; max-height: none; border-radius: 0; border: 0; animation: up 200ms var(--ease-out); }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.phone .panel .field { padding: 18px 14px 12px; }
.phone .cancel { border: 0; background: none; color: var(--accent); font: 500 15px var(--ui); cursor: pointer; }
.phone .res { padding: 11px 10px; }

/* ---------- focus mode ---------- */
.focus { position: absolute; inset: 0; z-index: 30; background: var(--paper); display: grid; overflow: auto; animation: fade 220ms var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.focus .col { width: min(680px, 100%); margin: 0 auto; padding: 96px 24px 140px; }
.focus h2 { font: 700 34px/1.15 var(--display); letter-spacing: -.035em; margin: 0 0 22px; }
.focus p { font: 400 20px/1.75 var(--read); margin: 0 0 18px; color: var(--ink); }
.caret { display: inline-block; width: 2px; height: 1.15em; vertical-align: -.2em; background: var(--accent); animation: blink 1.1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.count { position: fixed; position: absolute; right: 22px; bottom: 18px; font: 500 12px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 300ms; }
.focus:hover .count, .focus:focus-within .count { opacity: .75; }
.leave-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 12px; animation: hint 2.6s var(--ease-out) forwards; white-space: nowrap; }
@keyframes hint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
/* B: typewriter, the paragraph you are in stays bright */
.fB p { color: color-mix(in srgb, var(--ink) 32%, var(--paper)); transition: color 200ms; }
.fB p.cur { color: var(--ink); }
.fB h2 { color: color-mix(in srgb, var(--ink) 32%, var(--paper)); }
.fB .col { padding-top: 180px; }
/* C: a quiet strip that shows on hover at the top */
.strip { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; opacity: 0; transition: opacity 200ms; font-size: 13px; color: var(--muted); }
.fC:hover .strip, .strip:focus-within { opacity: 1; }
.strip .lv { border: 1px solid var(--edge); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: 500 12.5px var(--ui); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.strip .ttl { font-weight: 500; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.hidden-mobile { }
@media (max-width: 760px) {
  .window { grid-template-columns: minmax(0,1fr); height: 640px; }
  .side { display: none; }
  .page { padding: 28px 22px; }
  .optB .split { grid-template-columns: minmax(0,1fr); }
  .optB .preview { display: none; }
  .focus .col { padding: 64px 20px 100px; }
  .focus p { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Omnibar and focus mode</h1>
      <p class="sub">Click the bar or press <kbd>⌘K</kbd> / <kbd>Ctrl K</kbd>, then use the arrow keys, Enter and Esc. Try typing <i>tide</i>, <i>budget</i> or nonsense. In Focus mode, hover to see the word count and press Esc to leave.</p>
    </div>
    <div class="switches">
      <div class="seg" role="group" aria-label="Surface"><button id="t-omni" aria-pressed="true">Omnibar</button><button id="t-focus" aria-pressed="false">Focus mode</button></div>
      <div class="seg" role="group" aria-label="Option" id="opts"></div>
      <div class="seg" role="group" aria-label="Width" id="widths"><button id="w-desk" aria-pressed="true">Desktop</button><button id="w-phone" aria-pressed="false">Phone</button></div>
    </div>
  </header>
  <div class="optnote" id="note"></div>
  <div id="mount"></div>
</div>

<script>
const I = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  note: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  focus: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>',
  skin: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',
  ret: '<path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>', inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>', text: '<path d="M4 7V4h16v3M9 20h6M12 4v16"/>', shape: '<rect x="4" y="4" width="16" height="16" rx="3"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
}
const ic = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`

const NOTES = [
  { t: 'Tide tables for the Point Reyes trip', nb: 'Travel', c: '#2f9d8f', body: 'Low tide at 6:42, so the tide pools at Chimney Rock are reachable before breakfast. High tide comes back at 1:10.', when: 'Today' },
  { t: 'Q4 budget', nb: 'Home', c: '#d9822b', body: 'Insurance renewal moved to November. Budget for the roof inspection and the winter tires.', when: 'Yesterday' },
  { t: 'Bank and passport numbers', nb: 'Home', c: '#d9822b', secure: true, when: 'Mon' },
  { t: 'Reading list', nb: 'Resources', c: '#6a7bd8', body: 'The Overstory. A Pattern Language. The tide of the Pacific shapes the coast in Rising.', when: 'Oct 9' },
  { t: 'Meeting with Priya: onboarding flow', nb: 'Personal Note', c: '#2f6fe0', body: 'Keep the first run to one screen. The budget for motion is under 200 ms.', when: 'Oct 8' },
  { t: 'Sketch: kitchen shelves', nb: 'Home', c: '#d9822b', body: 'Two shelves at 38 cm and 76 cm, oak, hidden brackets.', when: 'Oct 2' },
]
const NBS = [{ t: 'Travel', c: '#2f9d8f', n: 7 }, { t: 'Home', c: '#d9822b', n: 12 }, { t: 'Personal Note', c: '#2f6fe0', n: 31 }, { t: 'Resources', c: '#6a7bd8', n: 9 }]
const ACTIONS = [
  { t: 'New note', k: '⌘N', i: 'plus' }, { t: 'Quick note', k: '⌘⇧N', i: 'bolt' }, { t: 'Focus mode', k: '⌘.', i: 'focus' },
  { t: 'Make this note secure', k: '', i: 'lock' }, { t: 'Switch skin', k: '', i: 'skin' },
]
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const hl = (s, q) => { if (!q) return esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)) }
const snip = (body, q) => { const i = body.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return null; const a = Math.max(0, i - 28); return (a ? '…' : '') + body.slice(a, i + q.length + 60) + '…' }

const state = { surface: 'omni', opt: { omni: 'A', focus: 'A' }, phone: false, open: false, q: '', sel: 0, filter: 'All', focusOn: false }
try { const s = JSON.parse(localStorage.getItem('omni-focus-mock') || '{}'); if (s.surface) Object.assign(state, { surface: s.surface, opt: { ...state.opt, ...s.opt } }) } catch {}
const save = () => { try { localStorage.setItem('omni-focus-mock', JSON.stringify({ surface: state.surface, opt: state.opt })) } catch {} }

const NOTES_TXT = {
  omni: {
    A: '<b>A · Spotlight.</b> The slim bar sits at the top centre. Opened, a 640 px panel drops just below it, over a soft dim. One column of groups: Notes, In your words, Notebooks, Actions. It is the quickest to scan and the closest to Raycast.',
    B: '<b>B · Two panes.</b> The same bar opens a wider panel. Results are on the left and a live preview of the highlighted note is on the right, so you can read before you jump. It is the best for finding the right one of several similar notes, and the heaviest.',
    C: '<b>C · The bar grows.</b> No dim and no jump: the bar itself unrolls downward into the results, like Chrome\'s address bar. Filter chips (All, Notes, Notebooks, Actions) sit at the top. It is the lightest and keeps the page visible.',
  },
  focus: {
    A: '<b>A · Paper column.</b> Everything goes and the words sit in a 680 px column on paper colour. A hint "Esc to leave" shows for two seconds, then fades. Hover anywhere and a faint word count appears bottom right.',
    B: '<b>B · Typewriter.</b> Like A, but the paragraph you are in stays bright and the rest fades back, and the line you type stays near the middle of the screen. It is the closest to iA Writer, and it suits long drafts.',
    C: '<b>C · Quiet strip.</b> Like A, plus a thin strip at the top that appears only on hover, with the note title, word count and a "Leave focus" button. It is the most discoverable way out, at the cost of a little chrome on hover.',
  },
}

function results() {
  const q = state.q.trim()
  const groups = []
  if (!q) {
    groups.push({ h: 'Recent', items: NOTES.slice(0, 4).map((n) => ({ kind: 'note', n })) })
    groups.push({ h: 'Actions', items: ACTIONS.slice(0, 3).map((a) => ({ kind: 'action', a })) })
  } else {
    const lq = q.toLowerCase()
    const byTitle = NOTES.filter((n) => n.t.toLowerCase().includes(lq))
    const byWords = NOTES.filter((n) => !n.secure && !byTitle.includes(n) && n.body.toLowerCase().includes(lq))
    const nbs = NBS.filter((n) => n.t.toLowerCase().includes(lq))
    const acts = ACTIONS.filter((a) => a.t.toLowerCase().includes(lq))
    if (byTitle.length) groups.push({ h: 'Notes', items: byTitle.map((n) => ({ kind: 'note', n })) })
    if (byWords.length) groups.push({ h: 'In your words', items: byWords.map((n) => ({ kind: 'words', n })) })
    if (nbs.length) groups.push({ h: 'Notebooks', items: nbs.map((b) => ({ kind: 'nb', b })) })
    if (acts.length) groups.push({ h: 'Actions', items: acts.map((a) => ({ kind: 'action', a })) })
  }
  if (state.opt.omni === 'C' && state.filter !== 'All') {
    const keep = { Notes: ['Notes', 'In your words', 'Recent'], Notebooks: ['Notebooks'], Actions: ['Actions'] }[state.filter]
    return groups.filter((g) => keep.includes(g.h))
  }
  return groups
}

function resHTML(it, i) {
  const q = state.q.trim(); const sel = i === state.sel ? ' sel' : ''
  if (it.kind === 'note' || it.kind === 'words') {
    const n = it.n
    if (n.secure) return `<button class="res secure${sel}" data-i="${i}"><span class="ri">${ic('lock')}</span><span class="rt"><span class="t">${hl(n.t, q)}</span><span class="s">Secure note · opens with Touch ID</span></span><span class="meta">${n.nb}</span><span class="ret">${ic('ret')}</span></button>`
    const s = it.kind === 'words' ? `<span class="s read">${hl(snip(n.body, q), q)}</span>` : `<span class="s">${n.nb} · ${n.when}</span>`
    return `<button class="res${sel}" data-i="${i}"><span class="ri">${ic('note')}</span><span class="rt"><span class="t">${hl(n.t, q)}</span>${s}</span><span class="ret">${ic('ret')}</span></button>`
  }
  if (it.kind === 'nb') return `<button class="res${sel}" data-i="${i}"><span class="ri"><span class="dot" style="--c:${it.b.c}"></span></span><span class="rt"><span class="t">${hl(it.b.t, q)}</span><span class="s">Notebook · ${it.b.n} notes</span></span><span class="ret">${ic('ret')}</span></button>`
  return `<button class="res${sel}" data-i="${i}"><span class="ri">${ic(it.a.i)}</span><span class="rt"><span class="t">${hl(it.a.t, q)}</span></span>${it.a.k ? `<span class="meta"><kbd>${it.a.k}</kbd></span>` : ''}<span class="ret">${ic('ret')}</span></button>`
}

function flat() { return results().flatMap((g) => g.items) }

function bodyHTML() {
  const groups = results(); let i = 0
  if (!groups.length) return `<div class="none"><b>Nothing matches "${esc(state.q)}"</b><span>Secure notes match by title only.</span><button class="res sel" data-i="0" style="max-width:320px;margin-top:10px"><span class="ri">${ic('plus')}</span><span class="rt"><span class="t">New note "${esc(state.q)}"</span></span><span class="ret">${ic('ret')}</span></button></div>`
  return groups.map((g) => `<div class="group"><h4>${g.h}</h4>${g.items.map((it) => resHTML(it, i++)).join('')}</div>`).join('')
}

function previewHTML() {
  const it = flat()[state.sel]
  if (!it) return `<div class="pv-lock" style="color:var(--muted)">${ic('note')}<p>Pick a result to preview it.</p></div>`
  if (it.kind === 'note' || it.kind === 'words') {
    const n = it.n
    if (n.secure) return `<div class="pv-path"><span class="dot" style="--c:${n.c};width:9px;height:9px;border-radius:50%;background:${n.c}"></span>${n.nb}</div><h3>${esc(n.t)}</h3><div class="pv-lock">${ic('lock')}<p>Secure note. Its words stay hidden here.<br>Open it to unlock with Touch ID.</p></div>`
    return `<div class="pv-path"><span style="width:9px;height:9px;border-radius:50%;background:${n.c}"></span>${n.nb} · edited ${n.when}</div><h3>${hl(n.t, state.q.trim())}</h3><p>${hl(n.body, state.q.trim())}</p><p style="opacity:.6">The page continues with two drawings and a checklist.</p>`
  }
  if (it.kind === 'nb') return `<div class="pv-path">Notebook</div><h3>${esc(it.b.t)}</h3><p>${it.b.n} notes. Enter opens the notebook in the sidebar.</p>`
  return `<div class="pv-path">Action</div><h3>${esc(it.a.t)}</h3><p>${it.a.k ? 'Shortcut ' + it.a.k + '. ' : ''}Enter runs it.</p>`
}

function panelHTML() {
  const o = state.opt.omni
  const field = `<div class="field">${ic('search')}<input id="q" placeholder="Search notes, words, notebooks, actions" value="${esc(state.q)}" autocomplete="off" spellcheck="false">${state.phone ? '<button class="cancel" id="cancel">Cancel</button>' : '<kbd>Esc</kbd>'}</div>`
  const foot = `<div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>Esc</kbd> close</span></div>`
  const chips = o === 'C' ? `<div class="chips">${['All', 'Notes', 'Notebooks', 'Actions'].map((c) => `<button class="chip" data-chip="${c}" aria-pressed="${state.filter === c}">${c}</button>`).join('')}</div>` : ''
  if (o === 'B' && !state.phone) return `<div class="panel">${field}<div class="split" style="min-height:0"><div class="body" id="body">${bodyHTML()}</div><div class="preview" id="pv">${previewHTML()}</div></div>${foot}</div>`
  return `<div class="panel">${field}<div class="body" id="body">${chips}${bodyHTML()}</div>${state.phone ? '' : foot}</div>`
}

const PAGE = `<h2>Tide tables for the Point Reyes trip</h2><p>Low tide at 6:42, so the tide pools at Chimney Rock are reachable before breakfast. High tide comes back at 1:10, which leaves the afternoon for the lighthouse.</p><p>Bring the paper map: there is no signal past Inverness.</p>`
const dock = `<div class="dock"><span>${ic('pen')}</span><span class="on">${ic('text')}</span><span>${ic('shape')}</span></div>`

function windowHTML() {
  if (state.phone) return `<div class="phone optA" id="win"><div class="ptop"><span class="gbtn" style="box-shadow:none">${ic('inbox')}</span><b style="font:600 14px var(--ui)">Travel</b><button class="gbtn omni-icon" id="omni" aria-label="Search">${ic('search')}</button></div><div class="page">${PAGE}</div>${state.open ? `<div class="scrim on" id="scrim"></div>${panelHTML()}` : ''}</div>`
  const side = `<aside class="side"><div class="brand"><i></i>Personal Note</div><div class="shelf">${ic('inbox')}Inbox<span class="n">3</span></div><div class="shelf open">Projects</div><div class="sub-row active">Travel</div><div class="sub-row">Personal Note</div><div class="shelf">Areas</div><div class="shelf">Resources</div><div class="shelf">Archive</div></aside>`
  const bar = `<div class="topbar"><div class="crumb">Travel <span>›</span> <b>Tide tables</b></div><button class="omni" id="omni" aria-label="Search">${ic('search')}<span class="ph">Search or jump to…</span><kbd>⌘K</kbd></button><div class="acts"><button class="gbtn" id="focusbtn" title="Focus mode (⌘.)">${ic('focus')}</button></div></div>`
  const focus = state.focusOn ? focusHTML() : ''
  return `<div class="window opt${state.opt.omni}" id="win">${side}<div class="stage">${bar}<div class="page">${PAGE}${dock}</div>${state.open ? `<div class="scrim on" id="scrim"></div>${panelHTML()}` : ''}</div>${focus}</div>`
}

const FOCUS_PARAS = [
  'Low tide at 6:42, so the tide pools at Chimney Rock are reachable before breakfast. High tide comes back at 1:10, which leaves the afternoon for the lighthouse.',
  'Bring the paper map: there is no signal past Inverness. The road to the lighthouse closes at 4:30 on weekdays, and the stairs down are 313 steps, so go early and come back up slowly.',
  'For lunch, the oyster farm at Drakes Estero sells by the dozen; bring a knife, a towel and a cooler with ice for the drive back',
  'Sunday: Tomales Point trail if the fog lifts. It is 9.5 miles there and back, flat, with tule elk near the end.',
]
function focusHTML() {
  const o = state.opt.focus
  const words = FOCUS_PARAS.join(' ').split(/\s+/).length + 5
  const paras = FOCUS_PARAS.map((p, i) => `<p class="${i === 2 ? 'cur' : ''}">${esc(p)}${i === 2 ? '<span class="caret"></span>' : ''}</p>`).join('')
  const strip = o === 'C' ? `<div class="strip"><span class="ttl">Tide tables for the Point Reyes trip</span><span style="display:flex;gap:10px;align-items:center"><span style="font-variant-numeric:tabular-nums">${words} words</span><button class="lv" id="leave">${ic('x')}Leave focus <kbd>Esc</kbd></button></span></div>` : ''
  return `<div class="focus f${o}" id="focus" tabindex="-1">${o !== 'C' ? '<div class="leave-hint">Esc or ⌘. to leave</div>' : ''}${strip}<div class="col"><h2>Tide tables for the Point Reyes trip</h2>${paras}</div>${o !== 'C' ? `<div class="count">${words} words · 4 min read</div>` : ''}</div>`
}

function render() {
  document.getElementById('t-omni').setAttribute('aria-pressed', state.surface === 'omni')
  document.getElementById('t-focus').setAttribute('aria-pressed', state.surface === 'focus')
  const key = state.surface
  document.getElementById('opts').innerHTML = ['A', 'B', 'C'].map((o) => `<button data-opt="${o}" aria-pressed="${state.opt[key] === o}">Option ${o}</button>`).join('')
  document.getElementById('widths').hidden = key !== 'omni'
  document.getElementById('w-desk').setAttribute('aria-pressed', !state.phone)
  document.getElementById('w-phone').setAttribute('aria-pressed', state.phone)
  document.getElementById('note').innerHTML = NOTES_TXT[key][state.opt[key]] + (key === 'omni' && state.phone ? ' <b>Phone:</b> the bar becomes a search icon; tapped, the search fills the screen, with Cancel to leave.' : '')
  if (key === 'focus') { state.phone = false; state.open = false; state.focusOn = true }
  document.getElementById('mount').innerHTML = windowHTML()
  wire()
}
function refreshResults() {
  const n = flat().length; state.sel = Math.max(0, Math.min(state.sel, Math.max(0, n - 1)))
  const b = document.getElementById('body'); if (!b) return
  const chips = b.querySelector('.chips')?.outerHTML ?? ''
  b.innerHTML = chips + bodyHTML()
  const pv = document.getElementById('pv'); if (pv) pv.innerHTML = previewHTML()
  b.querySelector('.res.sel')?.scrollIntoView({ block: 'nearest' })
  wireResults()
}
function openPanel() { state.open = true; state.sel = 0; render(); const q = document.getElementById('q'); q?.focus(); q?.setSelectionRange(q.value.length, q.value.length) }
function closePanel() { state.open = false; render(); document.getElementById('omni')?.focus() }
function pick() {
  const it = flat()[state.sel]
  if (it?.a?.t === 'Focus mode') { state.open = false; state.surface = 'focus'; save(); render(); return }
  closePanel()
}
function wireResults() {
  document.querySelectorAll('#body .res').forEach((b) => {
    b.onmouseenter = () => { state.sel = +b.dataset.i; document.querySelectorAll('#body .res').forEach((x) => x.classList.toggle('sel', x === b)); const pv = document.getElementById('pv'); if (pv) pv.innerHTML = previewHTML() }
    b.onclick = () => { state.sel = +b.dataset.i; pick() }
  })
  document.querySelectorAll('[data-chip]').forEach((c) => c.onclick = () => { state.filter = c.dataset.chip; state.sel = 0; document.querySelectorAll('[data-chip]').forEach((x) => x.setAttribute('aria-pressed', x === c)); refreshResults(); document.getElementById('q').focus() })
}
function wire() {
  document.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => { state.opt[state.surface] = b.dataset.opt; state.filter = 'All'; save(); render() })
  const omni = document.getElementById('omni'); if (omni) omni.onclick = openPanel
  const scrim = document.getElementById('scrim'); if (scrim) scrim.onclick = closePanel
  const cancel = document.getElementById('cancel'); if (cancel) cancel.onclick = closePanel
  const fb = document.getElementById('focusbtn'); if (fb) fb.onclick = () => { state.surface = 'focus'; save(); render() }
  const lv = document.getElementById('leave'); if (lv) lv.onclick = leaveFocus
  const q = document.getElementById('q')
  if (q) {
    q.oninput = () => { state.q = q.value; state.sel = 0; refreshResults() }
    q.onkeydown = (e) => {
      const n = flat().length || 1
      if (e.key === 'ArrowDown') { e.preventDefault(); state.sel = (state.sel + 1) % n; refreshResults() }
      else if (e.key === 'ArrowUp') { e.preventDefault(); state.sel = (state.sel - 1 + n) % n; refreshResults() }
      else if (e.key === 'Enter') { e.preventDefault(); pick() }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (state.q) { state.q = ''; q.value = ''; refreshResults() } else closePanel() }
    }
  }
  wireResults()
}
function leaveFocus() { state.focusOn = false; state.surface = 'omni'; save(); render() }
document.getElementById('t-omni').onclick = () => { state.surface = 'omni'; state.focusOn = false; save(); render() }
document.getElementById('t-focus').onclick = () => { state.surface = 'focus'; save(); render() }
document.getElementById('w-desk').onclick = () => { state.phone = false; state.open = false; render() }
document.getElementById('w-phone').onclick = () => { state.phone = true; state.open = false; render() }
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); if (state.surface === 'focus') { state.surface = 'omni'; state.focusOn = false } openPanel() }
  else if (mod && e.key === '.') { e.preventDefault(); if (state.surface === 'focus') leaveFocus(); else { state.surface = 'focus'; save(); render() } }
  else if (e.key === 'Escape' && state.surface === 'focus') leaveFocus()
})
if (state.surface === 'focus') state.focusOn = true
render()
</script>
